<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Despolariza! – Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <a class="nav-brand" href="#">
      <img src="imgs/logo despolariza.PNG" alt="Despolariza!">
      <span>Despolariza!</span>
    </a>

    <ul class="nav-links">
      <li><a href="#">Início</a></li>
      <li><a href="#">Aprofundamento</a></li>
      <li><a href="#">Fake News</a></li>
      <li><a href="#">Chat</a></li>
      <li><a href="#">Sobre</a></li>
    </ul>

    <div class="nav-search">
      <input type="text" placeholder="🔍 Pesquisar…" />
    </div>
  </nav>


  <div class="layout">

    <aside>
      <div class="sidebar-user">
        <div class="avatar"></div>
        <span>Usuário</span>
      </div>

      <p class="sidebar-history-title">Histórico de Mensagens</p>

      <ul class="sidebar-history">
        <li><a href="#">Exemplo 1</a></li>
        <li><a href="#">Exemplo 2</a></li>
        <li><a href="#">Exemplo 3</a></li>
        <li><a href="#">Exemplo 4</a></li>
      </ul>
    </aside>

    <main>


      <div class="chat-welcome">

        <div class="chat-welcome-logo">
          <img src="imgs/chat despolariza.PNG" alt="Logo Chat">
          <span>Chat Despolariza!</span>
        </div>

        <div class="chat-input-center">
          <div class="input-wrap">
            <input type="text" placeholder="Como podemos ajudá-lo?" />
            <button class="send-btn">➤</button>
          </div>
        </div>

        <div class="chips">
          <span class="chip">Dúvidas</span>
          <span class="chip">Comprovações</span>
          <span class="chip">Argumentos</span>
        </div>

      </div>

    </main>
  </div>

</body>
</html>
